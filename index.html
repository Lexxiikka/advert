<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoHello by Lexxikka</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        /* Reset & Base */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* Main content area — 25% margins on each side */
        .news-container {
            width: 50%;
            /* 100% - 25% - 25% = 50% */
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 0 80px;
        }

        /* Single large news card */
        .news-card {
            background: #111118;
            border: 1px solid #1e1e2a;
            border-radius: 12px;
            padding: 32px 36px;
            cursor: default;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* News title */
        .news-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #f0f0f0;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .news-title::before {
            content: "▎";
            color: #6c6c9e;
            margin-right: 10px;
        }

        /* News text */
        .news-text {
            font-size: 1rem;
            line-height: 1.8;
            color: #b0b0b8;
        }

        .news-text p {
            margin-bottom: 14px;
        }

        .news-text p:last-child {
            margin-bottom: 0;
        }

        /* Inline text styles */
        .news-text .highlight {
            color: #d4d4f5;
            background: linear-gradient(90deg, rgba(80, 80, 160, 0.15), transparent);
            padding: 0 4px;
            font-weight: 500;
        }

        .news-text .quote {
            border-left: 3px solid #4a4a7a;
            padding: 10px 20px;
            margin: 16px 0;
            color: #9090a8;
            font-style: italic;
            background: rgba(60, 60, 120, 0.06);
            border-radius: 0 6px 6px 0;
        }

        .news-text .code-inline {
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
            background: #0d0d14;
            border: 1px solid #1a1a2a;
            border-radius: 4px;
            padding: 1px 6px;
            color: #b8b8d8;
        }

        .news-text strong {
            color: #d0d0e8;
            font-weight: 600;
        }

        .news-text em {
            color: #a0a0b8;
        }

        .news-text a {
            color: #7a7acc;
            text-decoration: none;
            border-bottom: 1px dashed #3a3a6a;
            transition: color 0.2s, border-color 0.2s;
        }

        .news-text a:hover {
            color: #9a9aec;
            border-bottom-color: #7a7acc;
        }

        /* News images inside text */
        .news-text .news-image {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 18px 0 4px;
            border: 1px solid #1e1e2a;
        }

        .news-text .image-caption {
            font-size: 0.78rem;
            color: #555;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        /* ─── Right sidebar: news icons ─────────────────────────────── */

        .news-sidebar {
            position: fixed;
            right: max(12px, calc((100vw - 720px) / 2 - 80px));
            top: 30vh;
            /* 30% from top */
            transform: translateY(0);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 4px;
            z-index: 50;
            scrollbar-width: thin;
            scrollbar-color: #2a2a3a transparent;
        }

        .news-sidebar::-webkit-scrollbar {
            width: 3px;
        }

        .news-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .news-sidebar::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 2px;
        }

        /* Individual icon circle */
        .news-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #2a2a3a;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
            background: #111118;
            overflow: hidden;
        }

        .news-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
        }

        .news-icon:hover {
            border-color: #6c6c9e;
            box-shadow: 0 0 16px rgba(80, 80, 160, 0.3);
            transform: scale(1.1);
        }

        .news-icon.active {
            border-color: #8a8acc;
            box-shadow: 0 0 20px rgba(80, 80, 160, 0.45);
        }

        /* Tooltip */
        .news-icon .tooltip {
            position: absolute;
            right: calc(100% + 14px);
            top: 50%;
            transform: translateY(-50%);
            background: #1a1a2a;
            color: #d0d0e0;
            font-size: 0.78rem;
            padding: 6px 14px;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            border: 1px solid #2a2a3a;
            z-index: 60;
        }

        .news-icon:hover .tooltip {
            opacity: 1;
        }

        .news-icon .tooltip::after {
            content: "";
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            border-left: 6px solid #1a1a2a;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        /* Footer — always visible, fixed at bottom */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-top: 1px solid #1a1a2e;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 1px;
            background-color: #0a0a0a;
            z-index: 100;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a5a;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .news-sidebar {
                right: 12px;
            }
        }

        @media (max-width: 900px) {
            .news-container {
                width: 70%;
            }
        }

        @media (max-width: 600px) {
            .news-container {
                width: 88%;
                padding: 20px 0;
            }

            .news-card {
                padding: 20px 18px;
            }

            .news-title {
                font-size: 1.25rem;
            }

            .news-sidebar {
                right: 6px;
                gap: 10px;
            }

            .news-icon {
                width: 38px;
                height: 38px;
            }

            .news-icon .tooltip {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Main content: 25% margins on each side -->
    <main class="news-container">
        <div class="news-feed" id="newsFeed">
            <!-- Single news card injected by JS -->
        </div>
    </main>

    <!-- Right sidebar with circular news icons -->
    <nav class="news-sidebar" id="newsSidebar">
        <!-- Icons injected by JS -->
    </nav>

    <!-- Footer -->
    <footer class="footer">
        Design by Lexxikka &middot; idea from telegraph
    </footer>

    <script>
        console.log("Design by Lexxikka, idea from telegraph");

        // ─── News Data ────────────────────────────────────────────────
        const newsData = [{
            id: '0001',
            title: 'Новый релиз фреймворка Neon.js 3.0',
            text: `
                <p>
                    Вышла <strong>третья мажорная версия</strong> популярного JavaScript-фреймворка
                    <strong>Neon.js</strong>. Главные изменения — встроенная поддержка
                    <span class="highlight">серверных компонентов</span> и новый компилятор,
                    который обещает <em>ускорение до 40%</em>.
                </p>
                <div class="quote">
                    "Мы переписали ядро с нуля, чтобы сделать разработку ещё более
                    предсказуемой и быстрой."
                </div>
                <p>
                    Команда разработчиков отмечает, что новый компилятор написан на Rust
                    и обеспечивает <span class="highlight">значительно более быструю сборку</span>
                    по сравнению с предыдущей версией. Встроенная поддержка серверных компонентов
                    позволяет рендерить интерфейсы на стороне сервера без дополнительных настроек.
                </p>
                <p>
                    Кроме того, в Neon.js 3.0 появилась <em>новая система реактивности</em>,
                    основанная на сигналах, что даёт более предсказуемое обновление состояния
                    и упрощает отладку крупных приложений.
                </p>
                <img class="news-image" src="newsassets/0001_image_01.png" alt="Neon.js 3.0 preview">
                <div class="image-caption">Интерфейс нового компилятора Neon.js 3.0 в действии</div>
                <p>
                    Подробности — в <a href="#">официальном блоге</a>.
                </p>
            `
        }, {
            id: '0002',
            title: 'Квантовые вычисления: прорыв в области охлаждения кубитов',
            text: `
                <p>
                    Учёные из <strong>Цюрихского университета</strong> представили новый метод
                    охлаждения кубитов, который позволяет удерживать <span class="highlight">стабильное
                    состояние до 12 часов</span> — втрое дольше предыдущего рекорда.
                </p>
                <p>
                    Технология основана на использовании <span class="code-inline">топологических изоляторов</span>
                    и лазерного охлаждения. Это приближает эру <em>отказоустойчивых квантовых компьютеров</em>.
                </p>
                <div class="quote">
                    "Мы смогли подавить декогеренцию на беспрецедентно долгий срок.
                    Это открывает путь к практическим квантовым вычислениям."
                </div>
                <p>
                    Исследователи подчёркивают, что ключевым достижением стало использование
                    <span class="highlight">трёхслойной топологической защиты</span>, которая
                    изолирует кубиты от внешних электромагнитных помех. В экспериментах
                    участвовала система из <strong>128 кубитов</strong>, и все они сохраняли
                    когерентность в течение всего периода наблюдения.
                </p>
                <p>
                    Следующий этап — масштабирование технологии до <em>1000+ кубитов</em>
                    и интеграция с существующими квантовыми процессорами. Ожидается, что
                    коммерческое применение станет возможным уже в <strong>2028 году</strong>.
                </p>
                <img class="news-image" src="newsassets/0002_image_01.png" alt="Квантовый процессор">
                <div class="image-caption">Лабораторная установка для охлаждения кубитов в Цюрихском университете</div>
                <p>
                    Полный текст исследования опубликован в журнале <a href="#">Nature Physics</a>.
                </p>
            `
        }];

        let currentNewsId = '0001';

        // ─── Render single news ───────────────────────────────────────
        function renderNews(id) {
            const feed = document.getElementById('newsFeed');
            const item = newsData.find(n => n.id === id);
            if (!item) return;

            currentNewsId = id;

            feed.innerHTML = `
                <article class="news-card">
                    <h2 class="news-title">${item.title}</h2>
                    <div class="news-text">${item.text}</div>
                </article>
            `;

            // Update active icon
            document.querySelectorAll('.news-icon').forEach(el => {
                el.classList.toggle('active', el.dataset.id === id);
            });
        }

        // ─── Render sidebar icons ─────────────────────────────────────
        function renderSidebar() {
            const sidebar = document.getElementById('newsSidebar');

            sidebar.innerHTML = newsData.map(item => `
                <div class="news-icon${item.id === currentNewsId ? ' active' : ''}"
                     data-id="${item.id}"
                     onclick="renderNews('${item.id}')">
                    <img src="newsassets/${item.id}_icon.png"
                         alt="${item.title}"
                         loading="lazy">
                    <span class="tooltip">${item.title}</span>
                </div>
            `).join('');
        }

        // ─── Init ─────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderNews(currentNewsId);
        });
    </script>

</body>

</html>
