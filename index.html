<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Имени новостей Лексики</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Tektur:wght@400..900&family=Unbounded:wght@200..900&display=swap');
        
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Unbounded', 'Segoe UI', "Calibri";
            font-weight: 300;
        }

        .news-container {
            width: 50%;
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 0 80px;
        }

        .news-card {
            cursor: default;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .news-title {
            font-family: 'Russo One', sans-serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: #f0f0f0;
            margin-bottom: 20px;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .news-title::before {
            content: "\258E";
            color: #6c6c9e;
            margin-right: 10px;
        }

        .news-text {
            font-size: 1rem;
            line-height: 1.8;
            color: #b0b0b8;
        }

        .news-text p {
            margin-bottom: 14px;
        }

        .news-text p:last-child {
            margin-bottom: 0;
        }

        .news-text .highlight {
            color: #d4d4f5;
            background: linear-gradient(90deg, rgba(80, 80, 160, 0.15), transparent);
            padding: 0 4px;
            font-weight: 500;
        }

        .news-text .quote {
            font-family: 'Russo One', sans-serif;
            border-left: 3px solid #4a4a7a;
            padding: 10px 20px;
            margin: 16px 0;
            color: #9090a8;
            font-style: italic;
            background: rgba(60, 60, 120, 0.06);
            border-radius: 0 6px 6px 0;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .news-text .code-inline {
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
            background: #0d0d14;
            border: 1px solid #1a1a2a;
            border-radius: 4px;
            padding: 1px 6px;
            color: #b8b8d8;
        }

        .news-text strong {
            color: #d0d0e8;
            font-weight: 600;
        }

        .news-text em {
            color: #a0a0b8;
        }

        .news-text a {
            color: #7a7acc;
            text-decoration: none;
            border-bottom: 1px dashed #3a3a6a;
            transition: color 0.2s, border-color 0.2s;
        }

        .news-text a:hover {
            color: #9a9aec;
            border-bottom-color: #7a7acc;
        }

        .spoiler-toggle {
            font-family: 'Unbounded', sans-serif;
            display: block;
            cursor: pointer;
            color: #b0b0c8;
            background: rgba(60, 60, 120, 0.08);
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            padding: 10px 16px;
            margin: 14px 0 0;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            user-select: none;
        }

        .spoiler-toggle:hover {
            background: rgba(80, 80, 160, 0.15);
            border-color: #4a4a7a;
            color: #d0d0e8;
        }

        .spoiler-toggle::before {
            content: "\25B6";
            display: inline-block;
            margin-right: 10px;
            font-size: 0.75rem;
            transition: transform 0.25s;
            color: #6c6c9e;
        }

        .spoiler-toggle.open::before {
            transform: rotate(90deg);
        }

        .spoiler-content {
            font-family: 'Tektur', sans-serif;
            display: none;
            border-left: 3px solid #4a4a7a;
            padding: 12px 20px;
            margin: 0 0 14px;
            color: #9090a8;
            background: rgba(60, 60, 120, 0.06);
            border-radius: 0 6px 6px 0;
            font-style: normal;
            font-weight: 400;
        }

        .spoiler-content.open {
            display: block;
        }

        .hidden-spoiler-toggle {
            display: inline;
            cursor: pointer;
            color: inherit;
            user-select: none;
        }

        .hidden-spoiler-toggle:hover {
            opacity: 0.7;
        }

        .hidden-spoiler-content {
            font-family: 'Tektur', sans-serif;
            display: none;
            border-left: 3px solid #4a4a7a;
            padding: 10px 18px;
            margin: 10px 0 14px;
            color: #9090a8;
            background: rgba(60, 60, 120, 0.06);
            border-radius: 0 6px 6px 0;
            font-style: normal;
            font-weight: 400;
        }

        .hidden-spoiler-content.open {
            display: block;
        }

        .news-text .news-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 18px 0 4px;
            border: 1px solid #2a2a4a;
        }

        .news-text .news-image-sm {
            display: block;
            max-width: 60%;
            height: auto;
            border-radius: 6px;
            margin: 18px auto 4px;
            border: 1px solid #2a2a4a;
        }

        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            cursor: pointer;
        }

        .lightbox-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-overlay img {
            display: block;
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            cursor: default;
            object-fit: contain;
        }

        .news-text .image-desc {
            display: block;
            text-align: center;
            font-size: 0.85rem;
            color: #707088;
            margin: 4px 0 18px;
            font-style: italic;
        }

        .news-banner-wrap {
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            margin-right: calc(-50vw + 50%);
            overflow: hidden;
        }

        .news-banner-wrap .news-banner {
            display: block;
            width: 100%;
            height: auto;
            border: none;
            border-radius: 0;
        }

        .news-banner-start {
            margin-top: -32px;
            margin-bottom: 24px;
        }

        .news-banner-start .news-banner {
            display: block;
        }

        .news-text .image-caption {
            font-size: 0.78rem;
            color: #555;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .news-sidebar {
            position: fixed;
            right: 12px;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            overflow-y: auto;
            padding: 30vh 4px 4px;
            z-index: 110;
            scrollbar-width: thin;
            scrollbar-color: #2a2a3a transparent;
        }

        .news-sidebar::-webkit-scrollbar {
            width: 3px;
        }

        .news-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .news-sidebar::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 2px;
        }

        .news-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #2a2a3a;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
            background: #111118;
            box-shadow: 0 0 0 2px #0a0a0a, 0 0 24px 8px rgba(0, 0, 0, 0.7);
        }

        .news-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
        }

        .news-icon:hover {
            border-color: #6c6c9e;
            box-shadow: 0 0 32px 12px rgba(80, 80, 160, 0.3);
            transform: scale(1.1);
        }

        .news-icon.active {
            border-color: #8a8acc;
            box-shadow: 0 0 40px 16px rgba(80, 80, 160, 0.45);
        }

        .news-tooltip {
            position: fixed;
            background: #1a1a2a;
            color: #d0d0e0;
            font-size: 0.78rem;
            padding: 6px 14px;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
            border: 1px solid #2a2a3a;
            z-index: 200;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.15s, visibility 0.15s;
        }

        .news-tooltip.visible {
            visibility: visible;
            opacity: 1;
        }

        .news-tooltip::after {
            content: "";
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            border-left: 6px solid #1a1a2a;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        .footer {
            font-family: 'Tektur', sans-serif;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-top: 1px solid #1a1a2e;
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 1.5px;
            background-color: #0a0a0a;
            z-index: 100;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a5a;
        }

        html,
        body {
            overflow-x: hidden;
        }

        @media (max-width: 900px) {
            .news-container {
                width: 70%;
            }
        }

        @media (max-width: 600px) {
            .news-container {
                width: 88%;
                padding: 20px 0;
            }

            .news-title {
                font-size: 1.25rem;
            }

            .news-sidebar {
                right: 6px;
                bottom: 0;
                padding: 20vh 4px 4px;
            }

            .news-icon {
                width: 38px;
                height: 38px;
            }

            .news-tooltip {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="news-container">
        <div class="news-feed" id="newsFeed"></div>
    </main>

    <nav class="news-sidebar" id="newsSidebar"></nav>

    <div class="news-tooltip" id="newsTooltip"></div>

    <footer class="footer" id="newsFooter">
        footer &middot; site created accidentally
    </footer>

    <div id="imageLightbox" class="lightbox-overlay">
        <img id="lightboxImage" src="" alt="">
    </div>

    <script>
        console.log("Design by Lexxikka, idea is telegraph");
        let currentNewsId = '';

        const newsData = [
        {
                id: '0004',
                title: 'Я решил запостить сюда свою стату в СВО 6',
                date: '22.07.2026',
                visible: true,
                banner: null,
                bannerStart: false,
                text: `
                    <p>Новый сезон (4) начался уже, а я снова покупаю батлпасс... </p>
                    <p>Я же не зря профиль настраивал, вот теперь буду показывать.</p>
                    <img class="news-image" src="newsassets/0004_image_01.png" alt="">
                    <br>
                    <span class="image-desc">То, что сайт мертв, не значит что я не буду ничего постить!</span>
                `
            },
            {
                id: '0003',
                title: 'Этот сайт никому не нужен',
                date: '11.07.2026',
                visible: true,
                banner: null,
                bannerStart: false,
                text: `
                    <p>
                        Я архивирую этот сайт, причина: смерть сервера, ради которого он по сути был создан. Он останется активен, и, может быть, я буду даже сюда что-то публиковать но крайне редко и крайне непонятно зачем.
                    </p>
                    <img class="news-image" src="newsassets/0003_image_01.png" alt="">
                    <br>
                    <div class="quote">Всем пока!</div>
                    <br><br><br><br><br>
                    <span class="image-desc">upd: сайт воскрес?</span>
                `
            },
            {
                id: '0002',
                title: 'Новая часть Межсезонья',
                date: '30.06.2026',
                visible: true,
                banner: null,
                bannerStart: false,
                text: `
                    <br><p>
                        Прошло много времени с тех пор, как я делал что-то маштабное... <em>Что-то снова изменилось!</em>
                    </p>
                    <div class="quote">
                        Что же именно?
                    </div>
                    <br><p>
                        Сменился цикл игры в майнкрафт!
                    </p>
                    <p>
                        Сегодня я объявляю о начале сервера, который будет носить имя Межсезонье 2!, конечно же это нельзя назвать полноценным сервером, это локалка, где я надеюсь собрать лучших друзей и снова провести время вместе!
                    </p>
                    <br><div class="spoiler-toggle" onclick="toggleSpoiler(this)">
                        О сборке.
                    </div>
                    <div class="spoiler-content">
                        <p>По заветам, межсезонье будет модовой сборкой, которую собираю лично я. Каждый может предложить свой мод, но он будет рассматриваться. Тематика — техническая. В сборке уже присутствуют такие моды как Tech Reborn и его аддоны (порт великого Industrial Craft 2), а также много косметических модов.</p>
                        <p>Кто хочет предложить мод: <span class="code-inline">mc26.1.2+fabric-latest</span></p>
                    </div>
                    <img class="news-image" src="newsassets/0002_image_01.png" alt="">
                    
                    <br><br><div class="spoiler-toggle" onclick="toggleSpoiler(this)">
                        О MineLovely.
                    </div>
                    <div class="spoiler-content">
                        Я знаю, что обещал этим летом вам третий сезон, но вот какие дела — всё конечно же идет совсем не так, как я хотел бы. Моего свободного времени не хватит на его полноценную поддержку, особенно с тем размахом, который я хочу. Всё что я скажу — может оно и будет, и кидайтесь помидорами сколько хотите, мог бы я, "майнловеле" бы жыл.
                    </div>
                    <img class="news-image" src="newsassets/0002_image_02.png" alt="">
                    <br><br><div class="spoiler-toggle" onclick="toggleSpoiler(this)">
                        Немного концепции.
                    </div>
                    <div class="spoiler-content">
                        Так как сборка ещё редактируется, и по сути это единственная причина по которой у нас будет система "прыжков по мирам", которая существует для того, чтобы не отставать от обновлений модов на генерацию мира. Конечно же, это будут костыли, но мы будем переносить в новый мир часть построек и предметов, что дополнительно не даст нам перекачаться, хотя, возможно ли это?
                    </div>
                    <img class="news-image" src="newsassets/0002_image_03.png" alt="">
                    <br>
                    <p>
                        Ещё с первого межсезонья был чат в телеграме, я оставляю его, я делаю его чатом второго межсезонья. Чтож, готовьтесь, <a href="https://t.me/MineLovely_between_seasons">а желающим - просьба присоедениться! (tg)</a>
                        <br>Я вместе с вами, а вы, со мной?, так или иначе я надеюсь, что мы снова проведём время вместе, как в первый раз.
                    </p>
                    <p>
                        <span class="hidden-spoiler-toggle" onclick="toggleHiddenSpoiler(this)">Кто дочитал до сюда — вы интересные люди. Вот вам ссылка входа в мой секретный отсек, может быть даже кому-то из вас будет одобрен вход туда, но зачем?</span>
                    </p>
                    <div class="hidden-spoiler-content">
                        tg: <a href="https://t.me/+SG7guuag3PZlMTAy">Перейти в секретное место</a>
                    </div>
                `
            },
            {
                id: '0001',
                title: 'Новый макро-проект: новости вне discord и telegram',
                date: '30.06.2026',
                visible: true,
                banner: 'newsassets/0001_banner.png',
                bannerStart: false,
                text: `
                    <br>
                    <p>
                        Теперь тут иногда будут появляться различные новости. Зачем — да кто его знает, не я это придумал (я).
                    </p>
                    <p>
                        Расскажу откуда оно тут вообще — я хотел красиво рассказать о открытии <strong><em>MineLovely Between seasons 2</em></strong>, который вы знаете как <em>"Второй сезон Межсезонья"</em> или просто <strong><em>Межсезонье 2</em></strong>.
                    </p>
                    <p>
                        На вопрос как опубликовать новость я на секунду задумался о telegraph, но в итоге создал этот некий "клон", но только для меня.
                    </p>
                    <div class="quote">
                        я не буду думать зачем и почему, да и секунды через четыре этот проект будет забыл, слава бесплатному хостингу гитхаба, сайт этот будет доступен ещё огоэыйъъ ЪЪЪъ ъ ыыыы граната
                    </div>
                    <span class="image-desc">И прошу не забывать:</span>
                    <img class="news-image-sm" src="newsassets/001_img_01.png" alt="">
                `
            },
        ];

        function toggleSpoiler(el) {
            el.classList.toggle('open');
            const content = el.nextElementSibling;
            if (content && content.classList.contains('spoiler-content')) {
                content.classList.toggle('open');
            }
        }

        function toggleHiddenSpoiler(el) {
            const content = el.parentElement.nextElementSibling;
            if (content && content.classList.contains('hidden-spoiler-content')) {
                content.classList.toggle('open');
            }
        }

        function renderNews(id) {
            const feed = document.getElementById('newsFeed');
            const item = newsData.find(n => n.id === id);
            if (!item) return;

            currentNewsId = id;

            let bannerBefore = '';
            let bannerAfter = '';

            if (item.banner) {
                const bannerHtml = `
                    <div class="news-banner-wrap${item.bannerStart ? ' news-banner-start' : ''}">
                        <img class="news-banner" src="${item.banner}" alt="">
                    </div>
                `;

                if (item.bannerStart) {
                    bannerBefore = bannerHtml;
                } else {
                    bannerAfter = bannerHtml;
                }
            }

            feed.innerHTML = `
                ${bannerBefore}
                <article class="news-card">
                    <h2 class="news-title">${item.title}</h2>
                    ${bannerAfter}
                    <div class="news-text">${item.text}</div>
                </article>
            `;

            document.querySelectorAll('.news-icon').forEach(el => {
                el.classList.toggle('active', el.dataset.id === id);
            });

            const footer = document.getElementById('newsFooter');
            if (footer) {
                footer.textContent = `Сообщение от: ${item.date}  ·  site created accidentally  ·  ID: ${item.id}`;
            }
        }

        const tooltipEl = document.getElementById('newsTooltip');
        let hoveredIcon = null;

        function positionTooltip(el) {
            const rect = el.getBoundingClientRect();
            const x = rect.left;
            const y = rect.top + rect.height / 2;
            tooltipEl.style.right = (window.innerWidth - x + 12) + 'px';
            tooltipEl.style.top = (y - tooltipEl.offsetHeight / 2) + 'px';
        }

        function showTooltip(el) {
            hoveredIcon = el;
            tooltipEl.textContent = decodeURIComponent(el.dataset.title);
            positionTooltip(el);
            tooltipEl.classList.add('visible');
        }

        function hideTooltip() {
            hoveredIcon = null;
            tooltipEl.classList.remove('visible');
        }

        function renderSidebar() {
            const sidebar = document.getElementById('newsSidebar');

            sidebar.innerHTML = newsData.filter(item => item.visible !== false).map(item => {
                const safeTitle = encodeURIComponent(item.title);
                return `
                <div class="news-icon${item.id === currentNewsId ? ' active' : ''}"
                     data-id="${item.id}"
                     data-title="${safeTitle}"
                     onclick="renderNews('${item.id}')"
                     onmouseenter="showTooltip(this)"
                     onmouseleave="hideTooltip()">
                    <img src="newsassets/${item.id}_icon.png"
                         alt="${item.title}"
                         loading="lazy">
                </div>
                `;
            }).join('');

            sidebar.addEventListener('scroll', function () {
                if (hoveredIcon) {
                    positionTooltip(hoveredIcon);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            const visibleNews = newsData.filter(n => n.visible !== false);
            const latest = visibleNews.reduce((a, b) => a.id > b.id ? a : b);
            currentNewsId = latest.id;
            renderNews(currentNewsId);

            const lightbox = document.getElementById('imageLightbox');
            const lightboxImg = document.getElementById('lightboxImage');

            document.addEventListener('click', function (e) {
                const img = e.target.closest('.news-image');
                if (!img) return;

                if (img.getAttribute('src') === 'newsassets/0004_image_01.png') {
                    lightboxImg.src = img.src;
                    lightboxImg.alt = img.alt;
                    lightbox.classList.add('open');
                }
            });

            lightbox.addEventListener('click', function (e) {
                if (e.target === lightbox) {
                    lightbox.classList.remove('open');
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && lightbox.classList.contains('open')) {
                    lightbox.classList.remove('open');
                }
            });
        });
    </script>
</body>

</html>
